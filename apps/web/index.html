<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="storefront">
    <div class="storefront__frame">
      <div class="storefront__column">
        <header class="site-header" id="site-header" aria-label="Шапка сайта">
          <div class="site-header__inner">
            <a class="site-header__brand" href="/" aria-label="Digital Marketplace">
              <span class="site-header__brand-text">GGSEL</span>
            </a>

            <button
              type="button"
              class="catalog-button"
              id="catalog-button"
              aria-expanded="false"
              aria-controls="catalog-dropdown"
              aria-haspopup="true"
            >
              <span class="catalog-button__icon" aria-hidden="true">
                <img src="assets/catalog.svg" alt="" width="20" height="20" />
              </span>
              <span class="catalog-button__label">Каталог</span>
            </button>

            <div class="site-header__search" role="search">
              <div class="site-header__search-field u-field">
                <input
                  class="site-header__search-input"
                  type="search"
                  placeholder="Игра, приложение или услуга..."
                  aria-label="Поиск игр, приложений и услуг"
                  tabindex="-1"
                  readonly
                />
                <button
                  type="button"
                  class="site-header__favorite"
                  aria-label="Избранное"
                  tabindex="-1"
                >
                  <img src="assets/favorite.svg" alt="" width="14" height="13" />
                </button>
              </div>
              <button
                type="button"
                class="site-header__search-submit"
                aria-label="Искать"
                tabindex="-1"
              >
                <img src="assets/search.svg" alt="" width="20" height="20" />
              </button>
            </div>

            <button
              type="button"
              class="site-header__profile"
              aria-label="Профиль"
              tabindex="-1"
            >
              <span class="site-header__profile-icon" aria-hidden="true">
                <img
                  class="site-header__profile-head"
                  src="assets/profile-head.svg"
                  alt=""
                  width="8"
                  height="8"
                />
                <img
                  class="site-header__profile-body"
                  src="assets/profile-body.svg"
                  alt=""
                  width="13"
                  height="7"
                />
              </span>
            </button>
          </div>
        </header>

        <main class="storefront__main">
          <section
            class="storefront__section hero-carousel"
            id="hero-carousel"
            aria-label="Баннер-карусель"
            aria-roledescription="carousel"
          >
            <div class="hero-carousel__viewport">
              <div
                class="hero-carousel__track"
                id="hero-carousel-track"
                aria-live="polite"
              >
                <div class="hero-carousel__slide" role="group" aria-roledescription="slide" aria-label="Слайд 1 из 6">
                  <img class="hero-carousel__banner" src="assets/hero-banner.svg" alt="" width="1200" height="263" />
                </div>
                <div class="hero-carousel__slide" role="group" aria-roledescription="slide" aria-label="Слайд 2 из 6" aria-hidden="true">
                  <img class="hero-carousel__banner" src="assets/hero-banner.svg" alt="" width="1200" height="263" />
                </div>
                <div class="hero-carousel__slide" role="group" aria-roledescription="slide" aria-label="Слайд 3 из 6" aria-hidden="true">
                  <img class="hero-carousel__banner" src="assets/hero-banner.svg" alt="" width="1200" height="263" />
                </div>
                <div class="hero-carousel__slide" role="group" aria-roledescription="slide" aria-label="Слайд 4 из 6" aria-hidden="true">
                  <img class="hero-carousel__banner" src="assets/hero-banner.svg" alt="" width="1200" height="263" />
                </div>
                <div class="hero-carousel__slide" role="group" aria-roledescription="slide" aria-label="Слайд 5 из 6" aria-hidden="true">
                  <img class="hero-carousel__banner" src="assets/hero-banner.svg" alt="" width="1200" height="263" />
                </div>
                <div class="hero-carousel__slide" role="group" aria-roledescription="slide" aria-label="Слайд 6 из 6" aria-hidden="true">
                  <img class="hero-carousel__banner" src="assets/hero-banner.svg" alt="" width="1200" height="263" />
                </div>
              </div>

              <div class="hero-carousel__nav" aria-label="Навигация по слайдам">
                <button
                  type="button"
                  class="hero-carousel__arrow hero-carousel__arrow--prev"
                  id="hero-carousel-prev"
                  aria-label="Предыдущий слайд"
                >
                  <img src="assets/arrow-slider.svg" alt="" width="22" height="22" />
                </button>
                <button
                  type="button"
                  class="hero-carousel__arrow hero-carousel__arrow--next"
                  id="hero-carousel-next"
                  aria-label="Следующий слайд"
                >
                  <img src="assets/arrow-slider-next.svg" alt="" width="22" height="22" />
                </button>
              </div>

              <div
                class="hero-carousel__dots"
                id="hero-carousel-dots"
                role="tablist"
                aria-label="Индикаторы слайдов"
              >
                <button type="button" class="hero-carousel__dot hero-carousel__dot--active" role="tab" aria-selected="true" aria-label="Слайд 1" data-index="0"></button>
                <button type="button" class="hero-carousel__dot" role="tab" aria-selected="false" aria-label="Слайд 2" data-index="1"></button>
                <button type="button" class="hero-carousel__dot" role="tab" aria-selected="false" aria-label="Слайд 3" data-index="2"></button>
                <button type="button" class="hero-carousel__dot" role="tab" aria-selected="false" aria-label="Слайд 4" data-index="3"></button>
                <button type="button" class="hero-carousel__dot" role="tab" aria-selected="false" aria-label="Слайд 5" data-index="4"></button>
                <button type="button" class="hero-carousel__dot" role="tab" aria-selected="false" aria-label="Слайд 6" data-index="5"></button>
              </div>
            </div>
          </section>

          <section
            class="storefront__section category-icons"
            id="category-icons"
            aria-label="Категории сервисов"
          ></section>

          <section
            class="storefront__section steam-topup"
            id="steam-topup"
            aria-label="Пополнение Steam"
          ></section>

          <section
            class="storefront__section product-rail"
            id="popular-products"
            aria-label="Популярные товары"
          ></section>

          <section
            class="storefront__section product-rail"
            id="recommended-products"
            aria-label="Рекомендованные товары"
          ></section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
