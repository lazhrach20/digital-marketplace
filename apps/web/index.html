<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="storefront">
    <div class="storefront__frame">
      <div class="storefront__column">
        <header class="site-header" id="site-header" aria-label="Шапка сайта"></header>

        <main class="storefront__main">
          <section
            class="storefront__section hero-carousel"
            id="hero-carousel"
            aria-label="Баннер-карусель"
          ></section>

          <section
            class="storefront__section category-icons"
            id="category-icons"
            aria-label="Категории сервисов"
          ></section>

          <section
            class="storefront__section steam-topup"
            id="steam-topup"
            aria-label="Пополнение Steam"
          ></section>

          <section
            class="storefront__section product-rail"
            id="popular-products"
            aria-label="Популярные товары"
          ></section>

          <section
            class="storefront__section product-rail"
            id="recommended-products"
            aria-label="Рекомендованные товары"
          ></section>
        </main>
      </div>
    </div>
  </body>
</html>
