services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles:
      - api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/marketplace
      PORT: "3000"
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-3000}
      PROVIDER_A_RETRIES: ${PROVIDER_A_RETRIES:-2}
      PROVIDER_A_ERROR_RATE: ${PROVIDER_A_ERROR_RATE:-0}
      PROVIDER_A_TIMEOUT_RATE: ${PROVIDER_A_TIMEOUT_RATE:-0}
      PROVIDER_B_ERROR_RATE: ${PROVIDER_B_ERROR_RATE:-0}

volumes:
  postgres_data:
